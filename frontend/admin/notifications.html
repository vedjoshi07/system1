<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Notifications — FINDLY Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="../assets/css/style.css" rel="stylesheet">
  <link href="../assets/css/admin.css" rel="stylesheet">
</head>
<body data-page="notifications">
  <main class="fin-main">
    <div class="fin-page-head d-flex justify-content-between align-items-center flex-wrap gap-2">
      <div>
        <h1 class="fin-page-title">Notifications</h1>
        <p class="fin-page-sub mb-0">System events, moderation alerts, and report updates.</p>
      </div>
      <div id="markAllWrap" class="d-none">
        <button class="btn btn-outline-primary btn-sm" id="pageMarkAllRead">
          <i class="bi bi-check2-all me-1"></i>Mark all as read
        </button>
      </div>
    </div>

    <div class="fin-card">
      <div class="fin-card-body p-0" id="notifPageList">
        <div class="fin-empty"><div class="spinner-border spinner-border-sm text-primary me-2"></div>Loading…</div>
      </div>
    </div>
  </main>

  <script>window.BASE = "../";</script>
  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../config/config.js"></script>
  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/notifications.js"></script>
  <script src="../assets/js/admin.js"></script>
  <script>
    Auth.init(["ADMIN"]).then(load);

    async function load() {
      var list = $("#notifPageList");
      try {
        var d = await Notifications.loadAll();
        var notifs = d.notifications || [];
        list.html("");

        var hasUnread = notifs.some(function (n) { return !n.isRead || n.isRead === "0" || n.isRead === 0; });
        if (hasUnread) {
          $("#markAllWrap").removeClass("d-none");
        } else {
          $("#markAllWrap").addClass("d-none");
        }

        if (!notifs.length) {
          list.html('<div class="fin-empty py-5"><i class="bi bi-bell-slash fs-1 d-block mb-2 text-secondary"></i>You have no notifications yet.</div>');
          return;
        }

        var container = $('<div class="list-group list-group-flush"></div>');
        notifs.forEach(function (n) {
          var isUnread = !n.isRead || n.isRead === "0" || n.isRead === 0;
          var dateStr = window.formatDateTime ? window.formatDateTime(n.createdAt) : n.createdAt;

          var row = $(
            '<div class="list-group-item d-flex align-items-start gap-3 p-3 ' + (isUnread ? 'bg-light' : '') + '">' +
              '<div class="fin-avatar mt-1 ' + (isUnread ? 'text-bg-primary' : 'text-bg-light border') + '" style="width:38px;height:38px;flex-shrink:0">' +
                '<i class="bi ' + (isUnread ? 'bi-bell-fill' : 'bi-bell') + '"></i>' +
              '</div>' +
              '<div class="flex-grow-1">' +
                '<div class="' + (isUnread ? 'fw-bold text-dark' : 'text-secondary') + '">' + Auth.escapeHtml(n.message) + '</div>' +
                '<div class="small text-muted mt-1">' + (dateStr || 'Just now') + (n.itemTitle ? ' · <span class="fw-medium text-dark">' + Auth.escapeHtml(n.itemTitle) + '</span>' : '') + '</div>' +
              '</div>' +
              '<div class="d-flex align-items-center gap-1 flex-shrink-0">' +
                (isUnread ? '<button class="btn btn-sm btn-soft read-btn" data-id="' + n.notificationId + '">Mark read</button>' : '') +
              '</div>' +
            '</div>'
          );
          container.append(row);
        });

        list.append(container);

        $(".read-btn").on("click", async function () {
          var btn = $(this);
          var nid = btn.data("id");
          btn.prop("disabled", true).text("...");
          try {
            await Notifications.markRead(nid);
            window.showToast("Notification marked as read");
            load();
          } catch (err) {
            window.showToast(err.message, "danger");
            btn.prop("disabled", false).text("Mark read");
          }
        });

        $("#pageMarkAllRead").off("click").on("click", async function () {
          var unreadList = notifs.filter(function (n) { return !n.isRead || n.isRead === "0" || n.isRead === 0; });
          for (var i = 0; i < unreadList.length; i++) {
            try { await API.put("/api/notifications/" + unreadList[i].notificationId + "/read"); } catch (_) {}
          }
          Notifications.refreshBadge();
          window.showToast("All notifications marked as read");
          load();
        });

      } catch (err) {
        list.html('<div class="fin-empty fin-empty-error py-4 text-danger">Could not load notifications.</div>');
      }
    }
  </script>
</body>
</html>
