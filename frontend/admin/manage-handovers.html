<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Manage Handovers — FINDLY</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="../assets/css/style.css" rel="stylesheet">
  <link href="../assets/css/admin.css" rel="stylesheet">
</head>
<body data-page="manage-handovers">
  <main class="fin-main">
    <div class="fin-page-head">
      <h1 class="fin-page-title">Manage Handovers</h1>
      <p class="fin-page-sub mb-0">Track every found item through the custody → claim → resolve pipeline.</p>
    </div>

    <!-- Summary stat cards -->
    <div class="row g-3 mb-4">
      <div class="col-6 col-md-3">
        <div class="fin-stat">
          <div class="fin-stat-icon" style="background:#dbeafe;color:#2563eb"><i class="bi bi-archive"></i></div>
          <div class="min-w-0">
            <div class="fin-stat-val" id="statActive">—</div>
            <div class="fin-stat-label">Active (in custody)</div>
          </div>
        </div>
      </div>
      <div class="col-6 col-md-3">
        <div class="fin-stat">
          <div class="fin-stat-icon" style="background:#fef3c7;color:#d97706"><i class="bi bi-hand-thumbs-up"></i></div>
          <div class="min-w-0">
            <div class="fin-stat-val" id="statClaimed">—</div>
            <div class="fin-stat-label">Claimed (pending resolve)</div>
          </div>
        </div>
      </div>
      <div class="col-6 col-md-3">
        <div class="fin-stat">
          <div class="fin-stat-icon" style="background:#dcfce7;color:#16a34a"><i class="bi bi-check-circle"></i></div>
          <div class="min-w-0">
            <div class="fin-stat-val" id="statResolved">—</div>
            <div class="fin-stat-label">Resolved this month</div>
          </div>
        </div>
      </div>
      <div class="col-6 col-md-3">
        <div class="fin-stat">
          <div class="fin-stat-icon" style="background:#f0fdf4;color:#15803d"><i class="bi bi-box-seam"></i></div>
          <div class="min-w-0">
            <div class="fin-stat-val" id="statTotal">—</div>
            <div class="fin-stat-label">Total found items</div>
          </div>
        </div>
      </div>
    </div>

    <!-- Filter bar -->
    <form id="filterForm" class="row g-2 mb-3" novalidate>
      <div class="col-12 col-sm">
        <input type="text" class="form-control" id="q" name="q" placeholder="Search item title or location…">
      </div>
      <div class="col-6 col-sm-auto">
        <select class="form-select" id="status" name="status">
          <option value="ACTIVE" selected>Active</option>
          <option value="CLAIMED">Claimed</option>
          <option value="RESOLVED">Resolved</option>
          <option value="">All statuses</option>
        </select>
      </div>
      <div class="col-6 col-sm-auto">
        <button type="submit" class="btn btn-primary w-100"><i class="bi bi-funnel me-1"></i>Filter</button>
      </div>
    </form>

    <div class="fin-card">
      <div class="fin-card-body p-0">
        <div class="table-responsive">
          <table class="table fin-table align-middle mb-0">
            <thead class="table-light">
              <tr>
                <th>Item</th>
                <th>Category</th>
                <th>Status</th>
                <th>Custody</th>
                <th>Logged by</th>
                <th class="text-end">Actions</th>
              </tr>
            </thead>
            <tbody id="itemsBody"></tbody>
          </table>
          <div id="itemsEmpty" class="fin-empty d-none"><i class="bi bi-inbox"></i>No found items match.</div>
          <div class="fin-empty d-none" id="itemsLoading"><div class="spinner-border spinner-border-sm text-primary me-2"></div>Loading…</div>
        </div>
      </div>
    </div>
  </main>

  <script>window.BASE = "../";</script>
  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../config/config.js"></script>
  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/notifications.js"></script>
  <script src="../assets/js/search-filter.js"></script>
  <script src="../assets/js/student.js"></script>
  <script src="../assets/js/staff.js"></script>
  <script src="../assets/js/admin.js"></script>
  <script>
    Auth.init(["ADMIN"]).then(function () {
      loadStats();
      load();
    });
    Staff.bindTableActions(load);
    Notifications.refreshBadge();

    $("#filterForm").on("submit", function (e) { e.preventDefault(); load(); });

    async function loadStats() {
      try {
        var d = await API.get("/api/items?type=FOUND");
        var items = d.items;
        var active = 0, claimed = 0, resolved = 0;
        var now = new Date();
        items.forEach(function (it) {
          if (it.status === "ACTIVE")   active++;
          if (it.status === "CLAIMED")  claimed++;
          if (it.status === "RESOLVED") {
            var r = new Date(String(it.resolvedAt || it.createdAt).replace(" ", "T"));
            if (r.getFullYear() === now.getFullYear() && r.getMonth() === now.getMonth()) resolved++;
          }
        });
        $("#statActive").text(active);
        $("#statClaimed").text(claimed);
        $("#statResolved").text(resolved);
        $("#statTotal").text(items.length);
      } catch (_) {}
    }

    async function load() {
      $("#itemsLoading").removeClass("d-none");
      $("#itemsEmpty").addClass("d-none");
      var params = SearchFilter.readForm(document.getElementById("filterForm"));
      var qs = SearchFilter.toQueryString(params);
      try {
        var d = await API.get("/api/items?type=FOUND" + (qs ? "&" + qs : ""));
        var body = $("#itemsBody");
        body.empty();
        if (!d.items.length) { $("#itemsEmpty").removeClass("d-none"); }
        d.items.forEach(function (it) {
          var tr = document.createElement("tr");
          tr.innerHTML =
            "<td><div class='d-flex align-items-center gap-2'><img src='" + ItemUI.image(it) + "' class='fin-thumb' alt=''>" +
            "<div><div class='fw-semibold'>" + Auth.escapeHtml(it.title) + "</div>" +
            "<div class='small text-muted'>" + Auth.escapeHtml(it.location) + " · " + ItemUI.shortDate(it.itemDate) + "</div></div></div></td>" +
            "<td>" + Auth.escapeHtml(it.categoryName) + "</td>" +
            "<td>" + ItemUI.statusBadge(it.status) + "</td>" +
            "<td>" + Staff.custodyPill(it.custodyStatus) + "<div class='small text-muted'>" + Auth.escapeHtml(it.custodyLocation || "—") + "</div></td>" +
            "<td class='small'>" + Auth.escapeHtml(it.loggedByName || it.postedByName || "—") + "</td>" +
            "<td class='text-end whitespace-nowrap'>" + Staff.actions(it) + "</td>";
          body.append(tr);
        });
        $("#itemsLoading").addClass("d-none");
      } catch (err) {
        $("#itemsLoading").addClass("d-none");
        $("#itemsBody").html('<tr><td class="py-4 text-center text-danger" colspan="6">Could not load items.</td></tr>');
      }
    }
  </script>
</body>
</html>
